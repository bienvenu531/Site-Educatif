<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurore colorée abstraite">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="0.5" stop-color="#0a0f28"/>
      <stop offset="1" stop-color="#121836"/>
    </linearGradient>

    <radialGradient id="violet">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#6d4df0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6d4df0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#0ea5b7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0ea5b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#e11d48" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambre">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo">
      <stop offset="0" stop-color="#4b52d6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4b52d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ruban1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7c5cff" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruban2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruban3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>

    <filter id="flou" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="flou-fin" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <pattern id="points" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.5" stop-color="#050817" stop-opacity="0"/>
      <stop offset="1" stop-color="#050817" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ciel)"/>

  <g filter="url(#flou)">
    <ellipse cx="1260" cy="160" rx="480" ry="340" fill="url(#violet)"/>
    <ellipse cx="1490" cy="640" rx="390" ry="330" fill="url(#cyan)"/>
    <ellipse cx="1290" cy="900" rx="380" ry="240" fill="url(#teal)"/>
    <ellipse cx="240" cy="880" rx="480" ry="340" fill="url(#rose)"/>
    <ellipse cx="110" cy="210" rx="340" ry="280" fill="url(#indigo)"/>
    <ellipse cx="700" cy="80" rx="320" ry="200" fill="url(#ambre)"/>
  </g>

  <g filter="url(#flou-fin)" fill="none" stroke-linecap="round">
    <path d="M-90 640 C 250 430, 520 700, 850 480 S 1340 360, 1710 140" stroke="url(#ruban1)" stroke-width="24" opacity="0.55"/>
    <path d="M-90 780 C 300 570, 630 830, 990 610 S 1430 530, 1730 340" stroke="url(#ruban2)" stroke-width="16" opacity="0.45"/>
    <path d="M-90 450 C 240 270, 560 490, 910 320 S 1390 250, 1710 30" stroke="url(#ruban3)" stroke-width="10" opacity="0.4"/>
  </g>

  <g fill="none" stroke="#ffffff" opacity="0.12">
    <circle cx="1235" cy="330" r="320"/>
    <circle cx="1235" cy="330" r="430" opacity="0.6"/>
    <circle cx="1235" cy="330" r="540" opacity="0.32"/>
  </g>

  <rect width="1600" height="1000" fill="url(#points)"/>

  <g fill="#ffffff">
    <circle cx="340" cy="150" r="2" opacity="0.5"/>
    <circle cx="520" cy="240" r="1.4" opacity="0.4"/>
    <circle cx="760" cy="120" r="1.8" opacity="0.55"/>
    <circle cx="980" cy="210" r="1.2" opacity="0.35"/>
    <circle cx="1080" cy="90" r="2.2" opacity="0.5"/>
    <circle cx="1380" cy="180" r="1.6" opacity="0.45"/>
    <circle cx="1480" cy="420" r="2" opacity="0.4"/>
    <circle cx="1180" cy="540" r="1.5" opacity="0.35"/>
    <circle cx="860" cy="700" r="1.8" opacity="0.3"/>
    <circle cx="470" cy="620" r="1.6" opacity="0.35"/>
    <circle cx="160" cy="480" r="2" opacity="0.4"/>
    <circle cx="650" cy="860" r="1.4" opacity="0.3"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
